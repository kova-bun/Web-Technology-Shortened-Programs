
<!DOCTYPE html>

<head><title>Lists</title></head>

<h1>HTML Lists</h1>

<h2>Unordered</h2>
<ul><li>Apple</li><li>Banana</li><li>Cherry</li></ul>

<h2>Ordered</h2>
<ol><li>Step 1</li><li>Step 2</li><li>Step 3</li></ol>

<h2>Nested</h2>
<ul>
<li>Fruits<ul><li>Apple</li><li>Banana</li><li>Orange</li></ul></li>
<li>Vegetables<ul><li>Carrot</li><li>Broccoli</li></ul></li>
</ul>

<h2>Definition</h2>
<dl>
<dt>HTML</dt><dd>Markup Language</dd>

</dl>
